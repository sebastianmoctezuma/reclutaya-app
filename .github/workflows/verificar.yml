name: verificar
on: [push, pull_request]
jobs:
  analizar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.2", channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --debug --dart-define-from-file=defines/prod.example.json
  ios-sin-firma:
    runs-on: macos-latest
    # liquid_design exige el SDK de iOS 26: si el runner aún no lo trae, este trabajo
    # avisa pero no bloquea. El de Android y las pruebas sí bloquean.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.47.2", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --no-codesign --dart-define-from-file=defines/prod.example.json
