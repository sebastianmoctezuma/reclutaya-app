name: reclutaya_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^4.0.4
  chewie: ^1.17.2
  dio: ^5.11.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  liquid_design: ^0.4.1
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  sentry_flutter: ^9.30.1
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  video_player: ^2.14.1
dev_dependencies:
  analyzer: <14.0.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.1
  very_good_analysis: ^11.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/HankenGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/HankenGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HankenGrotesk-Bold.ttf
          weight: 700
